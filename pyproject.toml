[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "csre"
version = "0.1.0"
description = "Commerce Search & Ranking Engine: measurable product discovery on Amazon ESCI"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "duckdb>=1.1",
  "polars>=1.10",
  "pyarrow>=16",
  "numpy>=1.26",
  "scikit-learn>=1.4",
  "pyyaml>=6",
  "joblib>=1.3",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
csre = "csre.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
